<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take-That - Crea account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 680px;
            background: #111;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 4px solid #333;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: #2274C0;
            border-radius: 28px;
            padding: 22px 18px 18px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .screen::-webkit-scrollbar { display: none; }
        .intestazione {
            text-align: center;
            margin-bottom: 16px;
        }
        .intestazione h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.35);
        }
        .intestazione p {
            margin-top: 6px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 14px;
            font-weight: 600;
        }
        .campo {
            display: block;
            margin-bottom: 10px;
        }
        .campo span {
            display: block;
            margin-bottom: 4px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 12px;
            padding: 0 12px;
            background: #fff;
            color: #1a1a1a;
            font: 15px/1 'Segoe UI', Tahoma, sans-serif;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
            color-scheme: light;
        }
        input:focus {
            outline: 2px solid #fff;
            outline-offset: 1px;
        }
        .privacy {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 12px 2px 12px;
            color: #fff;
            font-size: 13px;
            line-height: 1.35;
        }
        .privacy input {
            width: 18px;
            height: 18px;
            margin-top: 1px;
            flex-shrink: 0;
            accent-color: #0d47a1;
        }
        .messaggio {
            margin-bottom: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            background: #fff;
            color: #b00020;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
        }
        .messaggio.ok { color: #1565C0; }
        .messaggio[hidden] { display: none; }
        .crea {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 13px 18px;
            background: linear-gradient(145deg, #2196F3, #0d47a1);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3), inset 0 2px 3px rgba(255, 255, 255, 0.35);
        }
        .crea:active { transform: scale(0.98); }
        .oppure {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .oppure::before,
        .oppure::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.45);
        }
        .social {
            width: 100%;
            margin-bottom: 8px;
            border: none;
            border-radius: 999px;
            padding: 11px 14px;
            background: #fff;
            color: #1a1a1a;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
        }
        .social:active { transform: scale(0.98); }
        .accedi {
            margin-top: 12px;
            text-align: center;
            color: #fff;
            font-size: 13px;
        }
        .accedi a {
            color: #fff;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <header class="intestazione">
                <h1>Take-That</h1>
                <p>Crea il tuo account</p>
            </header>

            <form id="signup" novalidate>
                <label class="campo">
                    <span>Nome utente</span>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="@utente" required>
                </label>
                <label class="campo">
                    <span>Indirizzo email</span>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="nome@email.it" required>
                </label>
                <label class="campo">
                    <span>Password</span>
                    <input id="password" name="password" type="password" autocomplete="new-password" required>
                </label>
                <label class="campo">
                    <span>Conferma password</span>
                    <input id="conferma" name="conferma" type="password" autocomplete="new-password" required>
                </label>
                <label class="campo">
                    <span>Data di nascita</span>
                    <input id="nascita" name="nascita" type="date" autocomplete="bday" required>
                </label>
                <label class="privacy">
                    <input id="privacy" name="privacy" type="checkbox" required>
                    <span>Accetto i Termini di Servizio e l'Informativa sulla Privacy</span>
                </label>
                <p class="messaggio" id="messaggio" role="alert" hidden></p>
                <button class="crea" type="submit">Crea Account</button>
            </form>

            <p class="oppure">oppure</p>
            <button class="social" type="button">Continua con Google</button>
            <button class="social" type="button">Continua con Apple</button>
            <p class="accedi">Hai già un account? <a href="login.html">Accedi</a></p>
        </div>
    </div>
    <script>
        var form = document.getElementById('signup');
        var messaggio = document.getElementById('messaggio');

        function avviso(testo, ok) {
            messaggio.textContent = testo;
            messaggio.className = ok ? 'messaggio ok' : 'messaggio';
            messaggio.hidden = false;
        }

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            messaggio.hidden = true;
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            var password = document.getElementById('password').value;
            var conferma = document.getElementById('conferma').value;
            if (password !== conferma) {
                avviso('Le password non coincidono.');
                document.getElementById('conferma').focus();
                return;
            }
            if (!document.getElementById('privacy').checked) {
                avviso('Accetta i Termini di Servizio e l\'Informativa sulla Privacy.');
                return;
            }
            sessionStorage.setItem('take-that-account', '1');
            location.href = 'index.html';
        });
    </script>
</body>
</html>
