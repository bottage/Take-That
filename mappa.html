<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Mappa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 680px;
            background: #111;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 4px solid #333;
            position: relative;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: #1e4f78;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            padding: 18px 0 0;
            position: relative;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 16px 6px;
            z-index: 2;
            flex-shrink: 0;
        }
        .back-btn {
            position: absolute;
            left: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1565C0;
            text-decoration: none;
            background: #fff;
            border: none;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
            cursor: pointer;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            margin-left: -2px;
        }
        .back-btn:hover { background: #f3f8ff; }
        .back-btn:active { transform: scale(0.94); }
        .title {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            text-align: center;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }
        .conto {
            margin-top: 2px;
            text-align: center;
            color: rgba(255, 255, 255, 0.88);
            font-size: 13px;
            font-weight: 600;
        }
        .viewport {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }
        .viewport.trascina { cursor: grabbing; }
        .world {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            aspect-ratio: 2 / 1;
            transform-origin: 0 0;
        }
        .world svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .dots {
            position: absolute;
            inset: 0;
        }
        .dot {
            position: absolute;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: grid;
            place-items: center;
        }
        .gem {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f6c51e;
            box-shadow: 0 1.5px 2px rgba(12, 36, 64, 0.45);
        }
        .dot:active .gem { transform: scale(0.85); }
        .badge {
            position: absolute;
            left: 13px;
            top: 1px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
            pointer-events: none;
        }
        .tag {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fff;
            border-radius: 8px;
            padding: 3px 7px 3px 3px;
            box-shadow: 0 2px 6px rgba(12, 36, 64, 0.28);
            cursor: pointer;
            white-space: nowrap;
        }
        .tag.sinistra {
            left: auto;
            right: 14px;
            flex-direction: row-reverse;
            padding: 3px 3px 3px 7px;
        }
        .tag.sotto, .tag.sopra {
            left: 50%;
            transform: translateX(-50%);
        }
        .tag.sotto { top: 34px; }
        .tag.sopra { top: auto; bottom: 34px; }
        .tag img {
            width: 28px;
            height: 22px;
            object-fit: cover;
            border-radius: 5px;
            display: block;
        }
        .tag-city {
            display: block;
            color: #1a1a1a;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.15;
        }
        .tag-who {
            display: block;
            color: #1565C0;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.15;
        }
        .zoom {
            position: absolute;
            right: 12px;
            bottom: 16px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .zoom-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: #fff;
            color: #1565C0;
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
            cursor: pointer;
            display: grid;
            place-items: center;
        }
        .zoom-btn svg { width: 18px; height: 18px; display: block; }
        .zoom-btn:hover { background: #f3f8ff; }
        .zoom-btn:active { transform: scale(0.94); }
        .zoom-btn[hidden] { display: none; }
        .viewer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 5;
            background: #050505;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viewer[hidden] { display: none; }
        .viewer-frame {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }
        .viewer-photo { width: 100%; height: auto; display: block; }
        .viewer .back-btn { top: 16px; left: 16px; z-index: 2; }
        .viewer-place {
            margin: 8px 0 0;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
        }
        .viewer-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 28px 16px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.78));
        }
        .viewer-sender { min-width: 0; flex: 1; }
        .viewer .sender { display: flex; align-items: flex-start; gap: 6px; }
        .viewer .flag {
            width: 22px;
            height: 15px;
            object-fit: cover;
            border-radius: 1px;
            flex-shrink: 0;
        }
        .viewer .sender-meta {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .viewer .name { color: #fff; font-size: 15px; font-weight: 700; line-height: 1.1; }
        .viewer .origin-row { display: flex; align-items: center; gap: 4px; }
        .viewer .origin { color: rgba(255,255,255,0.86); font-size: 12px; }
        .viewer .stars { font-size: 12px; letter-spacing: 0.4px; line-height: 1; }
        .viewer .stars.green { color: #9be36a; }
        .viewer .stars.purple { color: #d7b8ff; }
        .viewer .stars.slate { color: #c5d4ea; }
        .viewer .stars.red { color: #ff9aa8; }
        .viewer-chat {
            flex-shrink: 0;
            background: #fff;
            color: #1565C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
        }
        .viewer-chat:active { transform: scale(0.96); }
    </style>
</head>

        function quota(n, uno, tanti) {
            return n + ' ' + (n === 1 ? uno : tanti);
        }
        var paesi = {};
        var continenti = {};
        posti.forEach(function (p) {
            paesi[p.paese] = true;
            continenti[p.continente] = true;
        });
        document.getElementById('conto').textContent =
            quota(Object.keys(paesi).length, 'paese', 'paesi') + ' · ' +
            quota(Object.keys(continenti).length, 'continente', 'continenti');

        var viewport = document.getElementById('viewport');
        var world = document.getElementById('world');
        var dots = document.getElementById('dots');
        var zoomFit = document.getElementById('zoomFit');
        var MAX = 48;
        var SOGLIA = 12;
        var DISTANZA_CHIARA = 48;
        var scale = 1;
        var tx = 0;
        var ty = 0;
        var aCasa = false;

        function baseW() { return viewport.clientWidth; }
        function baseH() { return viewport.clientWidth / 2; }

        function applica() {
            world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
            zoomFit.hidden = aCasa;
        }

        function limita() {
            var w = baseW() * scale;
            var h = baseH() * scale;
            var vw = viewport.clientWidth;
            var vh = viewport.clientHeight;
            if (w <= vw) tx = (vw - w) / 2;
            else tx = Math.min(0, Math.max(vw - w, tx));
            if (h <= vh) ty = (vh - h) / 2;
            else ty = Math.min(0, Math.max(vh - h, ty));
        }

        function inquadra(lon, lat, gradi) {
            var vw = viewport.clientWidth;
            var vh = viewport.clientHeight;
            scale = Math.max(1, Math.min(MAX, (vw * 0.78) / (gradi / 360 * baseW())));
            var px = (lon + 180) / 360 * baseW();
            var py = (90 - lat) / 180 * baseH();
            tx = vw / 2 - px * scale;
            ty = vh / 2 - py * scale;
            limita();
            applica();
            disegnaPunti();
        }

        function italia() {
            aCasa = true;
            inquadra(12.5, 42.2, 10);
        }

        function zoomVerso(px, py, prossimo) {
            aCasa = false;
            prossimo = Math.max(1, Math.min(MAX, prossimo));
            var wx = (px - tx) / scale;
            var wy = (py - ty) / scale;
            scale = prossimo;
            tx = px - wx * scale;
            ty = py - wy * scale;
            limita();
            applica();
            disegnaPunti();
        }

        function centro() {
            return { x: viewport.clientWidth / 2, y: viewport.clientHeight / 2 };
        }

        function gruppiSchermo() {
            var box = world.getBoundingClientRect();
            var punti = posti.map(function (p) {
                return {
                    p: p,
                    x: box.left + (p.lon + 180) / 360 * box.width,
                    y: box.top + (90 - p.lat) / 180 * box.height
                };
            });
            var usati = [];
            var gruppi = [];
            punti.forEach(function (a, i) {
                if (usati[i]) return;
                var g = [a];
                usati[i] = true;
                var cresciuto = true;
                while (cresciuto) {
                    cresciuto = false;
                    punti.forEach(function (b, j) {
                        if (usati[j]) return;
                        var vicino = g.some(function (m) {
                            var dx = m.x - b.x;
                            var dy = m.y - b.y;
                            return dx * dx + dy * dy < SOGLIA * SOGLIA;
                        });
                        if (vicino) {
                            usati[j] = true;
                            g.push(b);
                            cresciuto = true;
                        }
                    });
                }
                gruppi.push(g);
            });
            return gruppi;
        }

        function mostraDati() {
            var min = Infinity;
            for (var i = 0; i < posti.length; i++) {
                for (var j = i + 1; j < posti.length; j++) {
                    var dx = (posti[i].lon - posti[j].lon) / 360 * baseW() * scale;
                    var dy = (posti[i].lat - posti[j].lat) / 180 * baseH() * scale;
                    var d = Math.hypot(dx, dy);
                    if (d < min) min = d;
                }
            }
            return min >= DISTANZA_CHIARA;
        }

        function disegnaPunti() {
            var gruppi = gruppiSchermo();
            var dati = mostraDati();
            dots.innerHTML = '';
            gruppi.forEach(function (g) {

                var btn = document.createElement('button');

                btn.className = 'dot';
                btn.style.left = ((lon + 180) / 360 * 100) + '%';
                btn.style.top = ((90 - lat) / 180 * 100) + '%';
                btn.style.transform = 'translate(-50%, -50%) scale(' + (1 / scale) + ')';
                if (g.length === 1) {

                        : '<span class="gem"></span>';
                    btn.addEventListener('click', function (event) {
                        event.stopPropagation();
                        apri(foto);

                    btn.setAttribute('aria-label', g.length + ' foto, avvicina');

                        : '<span class="gem"></span>';
                    btn.addEventListener('click', function (event) {
                        event.stopPropagation();
                        zoomGruppo(g.map(function (m) { return m.p; }));
                    });
                }
                dots.appendChild(btn);
            });
            sistemaEtichette();
        }

        function siToccano(a, b) {
            return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
        }

        function sistemaEtichette() {
            var view = viewport.getBoundingClientRect();
            var comandi = document.querySelector('.zoom').getBoundingClientRect();
            var tags = Array.prototype.slice.call(dots.querySelectorAll('.tag'));
            var posti = ['destra', 'sinistra', 'sotto', 'sopra'];
            function metti(tag, posto) {
                tag.classList.remove('sinistra', 'sotto', 'sopra');
                if (posto !== 'destra') tag.classList.add(posto);
            }
            function libera(tag, messi) {
                var r = tag.getBoundingClientRect();
                var bordo = 4;
                if (r.left < view.left + bordo || r.right > view.right - bordo || r.top < view.top + bordo || r.bottom > view.bottom - bordo) return false;
                if (siToccano(r, comandi)) return false;
                return !messi.some(function (altro) {
                    var b = altro.getBoundingClientRect();
                    return siToccano(
                        { left: r.left - 4, right: r.right + 4, top: r.top - 4, bottom: r.bottom + 4 },
                        b
                    );
                });
            }
            var messi = [];
            tags.forEach(function (tag) {
                var scelto = null;
                var dentro = null;
                for (var i = 0; i < posti.length; i++) {
                    metti(tag, posti[i]);
                    var r = tag.getBoundingClientRect();
                    var nelFoglio = r.left >= view.left + 4 && r.right <= view.right - 4 && r.top >= view.top + 4 && r.bottom <= view.bottom - 4 && !siToccano(r, comandi);
                    if (nelFoglio && !dentro) dentro = posti[i];
                    if (libera(tag, messi)) {
                        scelto = posti[i];
                        break;
                    }
                }
                metti(tag, scelto || dentro || 'sopra');
                messi.push(tag);
            });
        }

        function zoomGruppo(gruppo) {
            var lonMin = Infinity, lonMax = -Infinity, latMin = Infinity, latMax = -Infinity;
            gruppo.forEach(function (p) {
                lonMin = Math.min(lonMin, p.lon);
                lonMax = Math.max(lonMax, p.lon);
                latMin = Math.min(latMin, p.lat);
                latMax = Math.max(latMax, p.lat);
            });
            var vw = viewport.clientWidth;
            var vh = viewport.clientHeight;
            var bw = Math.max((lonMax - lonMin) / 360 * baseW(), 4);
            var bh = Math.max((latMax - latMin) / 180 * baseH(), 4);
            var prossimo = Math.min(MAX, Math.max(scale * 1.45, Math.min(vw * 0.38 / bw, vh * 0.38 / bh)));
            if (prossimo <= scale + 0.05) {
                apri(gruppo[0]);
                return;
            }
            var px = ((lonMin + lonMax) / 2 + 180) / 360 * baseW();
            var py = (90 - (latMin + latMax) / 2) / 180 * baseH();
            scale = prossimo;
            tx = vw / 2 - px * scale;
            ty = vh / 2 - py * scale;
            limita();
            applica();
            disegnaPunti();
        }

        var viewer = document.getElementById('viewer');
        var viewerPhoto = document.getElementById('viewerPhoto');

        function posizionaDidascalia() {
            if (!viewerPhoto.naturalWidth) return;
            var spazio = viewer.clientHeight - 168;
            var fattore = Math.min(viewer.clientWidth / viewerPhoto.naturalWidth, spazio / viewerPhoto.naturalHeight);
            document.getElementById('viewerFrame').style.width = Math.round(viewerPhoto.naturalWidth * fattore) + 'px';
        }

        function apri(p) {
            viewerPhoto.src = p.foto;
            viewerPhoto.alt = p.alt;
            document.getElementById('viewerPlace').textContent = p.quando;
            document.getElementById('viewerSender').innerHTML =
                '<div class="sender"><img class="flag" src="https://flagcdn.com/w40/' + p.bandiera + '.png" alt="">' +
                '<div class="sender-meta"><span class="name">' + p.nome + '</span>' +
                '<span class="origin-row"><span class="origin">' + p.paese + '</span><span class="stars ' + p.tinta + '">' + p.stelle + '</span></span>' +
                '</div></div>';
            document.getElementById('viewerChat').href = 'chat.html?user=' + encodeURIComponent(p.user);
            viewer.hidden = false;
            if (viewerPhoto.complete) posizionaDidascalia();
        }

        function chiudi() { viewer.hidden = true; }

        document.getElementById('zoomIn').addEventListener('click', function () {
            var c = centro();
            zoomVerso(c.x, c.y, scale * 1.7);
        });
        document.getElementById('zoomOut').addEventListener('click', function () {
            var c = centro();
            zoomVerso(c.x, c.y, scale / 1.7);
        });
        zoomFit.addEventListener('click', italia);
        document.getElementById('viewerClose').addEventListener('click', chiudi);
        viewerPhoto.addEventListener('load', posizionaDidascalia);
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && !viewer.hidden) chiudi();
        });

        viewport.addEventListener('wheel', function (event) {
            event.preventDefault();
            var r = viewport.getBoundingClientRect();
            var fattore = event.deltaY < 0 ? 1.18 : 1 / 1.18;
            zoomVerso(event.clientX - r.left, event.clientY - r.top, scale * fattore);
        }, { passive: false });

        var puntatori = {};
        var pizzico = null;
        var trascinato = false;

        viewport.addEventListener('pointerdown', function (event) {
            if (event.target.closest('.dot')) return;
            puntatori[event.pointerId] = { x: event.clientX, y: event.clientY };
            viewport.setPointerCapture(event.pointerId);
            var ids = Object.keys(puntatori);
            if (ids.length === 2) {
                var a = puntatori[ids[0]];
                var b = puntatori[ids[1]];
                pizzico = {
                    dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
                    scale: scale,
                    x: (a.x + b.x) / 2,
                    y: (a.y + b.y) / 2
                };
            }
            trascinato = false;
        });
        viewport.addEventListener('pointermove', function (event) {
            if (!puntatori[event.pointerId]) return;
            var prima = puntatori[event.pointerId];
            puntatori[event.pointerId] = { x: event.clientX, y: event.clientY };
            var ids = Object.keys(puntatori);
            if (ids.length >= 2 && pizzico) {
                var a = puntatori[ids[0]];
                var b = puntatori[ids[1]];
                var dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
                var r = viewport.getBoundingClientRect();
                zoomVerso(pizzico.x - r.left, pizzico.y - r.top, pizzico.scale * dist / pizzico.dist);
                return;
            }
            var dx = event.clientX - prima.x;
            var dy = event.clientY - prima.y;
            if (Math.abs(dx) + Math.abs(dy) > 2) {
                trascinato = true;
                aCasa = false;
            }
            tx += dx;
            ty += dy;
            limita();
            applica();
            viewport.classList.add('trascina');
        });
        function rilascia(event) {
            delete puntatori[event.pointerId];
            if (Object.keys(puntatori).length < 2) pizzico = null;
            viewport.classList.remove('trascina');
            if (trascinato) disegnaPunti();
            trascinato = false;
        }
        viewport.addEventListener('pointerup', rilascia);
        viewport.addEventListener('pointercancel', rilascia);

        italia();
    </script>
</body>
</html>
