<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Album</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 720px;
            background: #111;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        .screen {
            width: 100%;
            height: 100%;
            /* Stesso sfondo della Home */
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            position: relative;
            overflow-y: auto;
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Livello azzurro semitrasparente per coerenza con la Home */
            background: rgba(130, 170, 210, 0.85); 
            z-index: 1;
            pointer-events: none;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
            z-index: 2;
        }
        .back-btn {
            position: absolute;
            left: 0;
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: normal;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            z-index: 2;
            position: relative;
            padding-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 4px;
            padding: 4px; /* Bordino bianco polaroid */
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            aspect-ratio: 4/3; /* Formato rettangolare tipico delle foto */
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            
            <div class="header">
                <a href="index.html" class="back-btn">←</a>
                <div class="title">ALBUM</div>
            </div>

            <div class="grid-container">
                <!-- 1. Concerto -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1540039155733-56f1c328c9d0?w=400&q=80" alt="Concerto">
                </div>
                <!-- 2. Fuochi d'artificio -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1498931299472-f7a63a5a1cfa?w=400&q=80" alt="Fuochi">
                </div>
                <!-- 3. Libri -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=400&q=80" alt="Libri">
                </div>
                <!-- 4. Maratona -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1552674605-171d31fea3fa?w=400&q=80" alt="Maratona">
                </div>
                <!-- 5. Torta al cioccolato -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&q=80" alt="Torta">
                </div>
                <!-- 6. Cuccioli -->
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=400&q=80" alt="Cuccioli">
                </div>
            </div>

        </div>
    </div>
</body>
</html>
