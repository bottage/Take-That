<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Album</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 680px;
            background: #111;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 4px solid #333;
            position: relative;
        }
        .screen {
            width: 100%;
            height: 100%;
            /* Stesso sfondo della Home */
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            padding: 25px 15px;
            position: relative;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .screen::-webkit-scrollbar {
            display: none;
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Livello azzurro semitrasparente per coerenza con la Home */
            background: rgba(130, 170, 210, 0.85); 
            z-index: 1;
            pointer-events: none;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 16px;
            z-index: 2;
        }
        .back-btn {
            position: absolute;
            left: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #1565C0;
            text-decoration: none;
            background: #fff;
            border: none;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
            transition: background 0.2s, transform 0.12s, color 0.2s;
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            margin-left: -2px;
        }
        .back-btn:hover {
            background: #f3f8ff;
            color: #0d47a1;
        }
        .back-btn:active {
            transform: scale(0.94);
        }

        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            z-index: 2;
            position: relative;
            padding-bottom: 4px;
        }
        .card {
            background: white;
            border-radius: 4px;
            padding: 4px 4px 6px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .photo-btn {
            display: block;
            width: 100%;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 2px;
        }
        .photo-btn:active .photo {
            opacity: 0.82;
        }
        .card .photo {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }
        .viewer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            z-index: 5;
            background: #050505;
            border-radius: 28px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viewer[hidden] {
            display: none;
        }
        .viewer-frame {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }
        .viewer-photo {
            width: 100%;
            height: auto;
            display: block;
            background: transparent;
        }
        .viewer .back-btn {
            top: 16px;
            left: 16px;
            z-index: 2;
        }
        .viewer-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 28px 16px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.78));
        }
        .viewer-place {
            margin: 8px 0 0;
            text-align: center;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
        }
        .viewer-sender {
            min-width: 0;
            flex: 1;
        }
        .viewer-sender .sender {
            padding: 0;
        }
        .viewer-chat {
            flex-shrink: 0;
            background: #fff;
            color: #1565C0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
        }
        .viewer-chat:hover {
            background: #f3f8ff;
        }
        .viewer-chat:active {
            transform: scale(0.96);
        }
        .viewer .name {
            color: #fff;
            font-size: 15px;
        }
        .viewer .origin {
            color: rgba(255, 255, 255, 0.86);
            font-size: 12px;
        }
        .viewer .stars {
            font-size: 12px;
        }
        .viewer .stars.purple { color: #d7b8ff; }
        .viewer .stars.slate { color: #c5d4ea; }
        .viewer .flag {
            width: 22px;
            height: 15px;
        }
        .sender {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 6px 3px 2px;
        }
        .flag {
            width: 18px;
            height: 12px;
            object-fit: cover;
            border-radius: 1px;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.25);
        }
        .sender-meta {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .name {
            font-size: 11px;
            font-weight: 700;
            color: #111;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .origin-row {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        .origin {
            font-size: 10px;
            color: #555;
            line-height: 1;
            white-space: nowrap;
        }
        .stars {
            font-size: 9px;
            line-height: 1;
            letter-spacing: 0.4px;
        }
        .stars.purple { color: #8d5fd4; }
        .stars.slate { color: #516d91; }
        .stars.green { color: #82da3d; }
        .stars.red { color: #ef233c; }
        .shot,
        .shot-time {
            display: block;
            font-size: 10px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .shot {
            margin-top: 3px;
            font-weight: 700;
            color: #222;
        }
        .shot-time {
            color: #555;
        }
        .viewer .shot,
        .viewer .shot-time {
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            
            <div class="header">
                <a href="index.html" class="back-btn" aria-label="Indietro">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <div class="title">ALBUM</div>
            </div>

            <div class="grid-container">
                <div class="card" data-user="aiko">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Aiko_22">
                        <img class="photo" src="https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=400&q=80" alt="Tokyo, Aiko_22">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/jp.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Aiko_22</span>
                            <span class="origin-row"><span class="origin">Giappone</span><span class="stars green">★★★★</span></span>
                            <span class="shot">Tokyo</span>
                            <span class="shot-time">20 ott, 21:14</span>
                        </div>
                    </div>
                </div>
                <div class="card" data-user="rick">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Rick34">
                        <img class="photo" src="https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=400&q=80" alt="Concerto, Rick34">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/fr.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Rick34</span>
                            <span class="origin-row"><span class="origin">Francia</span><span class="stars purple">★★★★</span></span>
                            <span class="shot">Parigi</span>
                            <span class="shot-time">12 ott, 22:40</span>
                        </div>
                    </div>
                </div>
                <div class="card" data-user="alex">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Alex12">
                        <img class="photo" src="https://images.unsplash.com/photo-1498931299472-f7a63a5a1cfa?w=400&q=80" alt="Fuochi, Alex12">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/de.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Alex12</span>
                            <span class="origin-row"><span class="origin">Germania</span><span class="stars slate">★★</span></span>
                            <span class="shot">Berlino</span>
                            <span class="shot-time">3 ott, 23:05</span>
                        </div>
                    </div>
                </div>
                <div class="card" data-user="pippo">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Pippo3">
                        <img class="photo" src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=400&q=80" alt="Libri, Pippo3">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/it.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Pippo3</span>
                            <span class="origin-row"><span class="origin">Italia</span><span class="stars green">★★★</span></span>
                            <span class="shot">Roma</span>
                            <span class="shot-time">28 set, 16:20</span>
                        </div>
                    </div>
                </div>
                <div class="card" data-user="edu">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Edu_78">
                        <img class="photo" src="https://images.unsplash.com/photo-1452626038306-9aae5e071dd3?w=400&q=80" alt="Maratona, Edu_78">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/es.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Edu_78</span>
                            <span class="origin-row"><span class="origin">Spagna</span><span class="stars red">★★★★★</span></span>
                            <span class="shot">Madrid</span>
                            <span class="shot-time">19 set, 09:12</span>
                        </div>
                    </div>
                </div>
                <div class="card" data-user="tod">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Tod_3">
                        <img class="photo" src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&q=80" alt="Torta, Tod_3">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/us.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Tod_3</span>
                            <span class="origin-row"><span class="origin">USA</span><span class="stars green">★★★</span></span>
                            <span class="shot">New York</span>
                            <span class="shot-time">4 set, 15:48</span>
                        </div>
                    </div>
                </div>
                <div class="card" data-user="liu">
                    <button type="button" class="photo-btn" aria-label="Apri la foto di Liu09">
                        <img class="photo" src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=400&q=80" alt="Cuccioli, Liu09">
                    </button>
                    <div class="sender">
                        <img class="flag" src="https://flagcdn.com/w40/cn.png" alt="">
                        <div class="sender-meta">
                            <span class="name">Liu09</span>
                            <span class="origin-row"><span class="origin">Cina</span><span class="stars slate">★★</span></span>
                            <span class="shot">Shanghai</span>
                            <span class="shot-time">18 ago, 11:30</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
        <div class="viewer" id="viewer" hidden>
            <button type="button" class="back-btn" id="viewerClose" aria-label="Chiudi">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <div class="viewer-frame" id="viewerFrame">
                <img class="viewer-photo" id="viewerPhoto" alt="">
                <p class="viewer-place" id="viewerPlace"></p>
            </div>
            <div class="viewer-caption">
                <div class="viewer-sender" id="viewerSender"></div>
                <a class="viewer-chat" id="viewerChat" href="chat.html">Chat</a>
            </div>
        </div>
    </div>
    <script>
        var viewer = document.getElementById('viewer');
        var viewerPhoto = document.getElementById('viewerPhoto');
        var viewerSender = document.getElementById('viewerSender');
        var viewerChat = document.getElementById('viewerChat');
        var params = new URLSearchParams(location.search);
        var openedFrom = params.get('from');
        var openedUser = params.get('user');

        function posizionaDidascalia() {
            if (!viewerPhoto.naturalWidth) return;
            var spazio = viewer.clientHeight - 168;
            var scala = Math.min(viewer.clientWidth / viewerPhoto.naturalWidth, spazio / viewerPhoto.naturalHeight);
            document.getElementById('viewerFrame').style.width = Math.round(viewerPhoto.naturalWidth * scala) + 'px';
        }

        function didascalia(sender) {
            var mesi = {
                gen: 'gennaio', feb: 'febbraio', mar: 'marzo', apr: 'aprile',
                mag: 'maggio', giu: 'giugno', lug: 'luglio', ago: 'agosto',
                set: 'settembre', ott: 'ottobre', nov: 'novembre', dic: 'dicembre'
            };
            var luogo = sender.querySelector('.shot').textContent;
            var pezzi = sender.querySelector('.shot-time').textContent.split(',');
            var giorno = pezzi[0].trim().split(' ');
            var mese = mesi[giorno[1]] || giorno[1];
            return luogo + ' · ' + giorno[0] + ' ' + mese + ', ' + pezzi[1].trim();
        }

        function apriFoto(card) {
            var img = card.querySelector('.photo');
            var sender = card.querySelector('.sender');
            var user = card.getAttribute('data-user');
            var copia = sender.cloneNode(true);
            copia.querySelectorAll('.shot, .shot-time').forEach(function (el) { el.remove(); });
            viewerPhoto.src = img.src.replace('w=400', 'w=1200');
            viewerPhoto.alt = img.alt;
            viewerSender.innerHTML = copia.innerHTML;
            document.getElementById('viewerPlace').textContent = didascalia(sender);
            viewerChat.href = 'chat.html?user=' + encodeURIComponent(user);
            viewer.hidden = false;
            if (viewerPhoto.complete) posizionaDidascalia();
        }

        function chiudiFoto() {
            if (openedFrom === 'list' && openedUser && /^[a-z]+$/.test(openedUser)) {
                location.href = 'chat.html';
                return;
            }
            if (openedFrom === 'chat' && openedUser && /^[a-z]+$/.test(openedUser)) {
                location.href = 'chat.html?user=' + encodeURIComponent(openedUser);
                return;
            }
            viewer.hidden = true;
            viewerPhoto.removeAttribute('src');
            viewerSender.innerHTML = '';
            document.getElementById('viewerPlace').textContent = '';
        }

        document.querySelectorAll('.photo-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                apriFoto(btn.parentElement);
            });
        });

        if (openedUser && /^[a-z]+$/.test(openedUser)) {
            var card = document.querySelector('.card[data-user="' + openedUser + '"]');
            if (card) apriFoto(card);
        }

        document.getElementById('viewerClose').addEventListener('click', chiudiFoto);
        viewerPhoto.addEventListener('load', posizionaDidascalia);
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && !viewer.hidden) chiudiFoto();
        });
    </script>
</body>
</html>
