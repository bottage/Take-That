<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 680px;
            background: #111;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 4px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: url('cielo-aereo.jpg') no-repeat center center/cover;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 1;
        }
        .top-logo, .menu-container, .bottom-element {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-scatta {
            background: linear-gradient(145deg, #2196F3, #0d47a1);
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            margin-top: 10px;
        }
        .btn-scatta:active {
            transform: scale(0.96);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .menu-container {
            gap: 12px;
            width: 86%;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.42);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-decoration: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 18px rgba(8, 40, 80, 0.16);
        }
        .menu-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.28);
        }
        .menu-btn:active {
            transform: scale(0.98);
        }
        .bottom-element {
            min-height: 148px;
        }
        .impostazioni {
            position: absolute;
            bottom: 18px;
            left: 16px;
            z-index: 3;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.42);
            color: #fff;
            backdrop-filter: blur(10px);
            display: grid;
            place-items: center;
        }
        .impostazioni svg {
            width: 18px;
            height: 18px;
            display: block;
        }
        .impostazioni:active { transform: scale(0.94); }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <a href="impostazioni.html" class="impostazioni" aria-label="Impostazioni">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M10.1 2h3.8l.5 2.4c.6.2 1.2.5 1.7.9l2.2-1.1 2.7 2.7-1.1 2.2c.4.5.7 1.1.9 1.7l2.4.5v3.8l-2.4.5a7 7 0 0 1-.9 1.7l1.1 2.2-2.7 2.7-2.2-1.1a7 7 0 0 1-1.7.9l-.5 2.4h-3.8l-.5-2.4a7 7 0 0 1-1.7-.9L6 21.3 3.3 18.6l1.1-2.2a7 7 0 0 1-.9-1.7L1.1 14.2V10.4l2.4-.5c.2-.6.5-1.2.9-1.7L3.3 6 6 3.3l2.2 1.1c.5-.4 1.1-.7 1.7-.9L10.1 2zm1.9 6.2a3.8 3.8 0 1 0 .01 7.61A3.8 3.8 0 0 0 12 8.2z"/>
                </svg>
            </a>
            <div class="top-logo">
                <a href="scatta.html" class="btn-scatta" style="text-decoration: none; display: inline-block;">SCATTA</a>
            </div>
            <div class="menu-container">
                <a href="album.html" class="menu-btn">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/></svg>
                    ALBUM
                </a>
                <a href="chat.html" class="menu-btn">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 6.5h14a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4 3v-3H5a1 1 0 0 1-1-1V7.5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                    CHAT
                </a>
                <a href="mappa.html" class="menu-btn">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="11" r="2" stroke="currentColor" stroke-width="1.7"/></svg>
                    MAPPA
                </a>
                <a href="profilo.html" class="menu-btn">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.5" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M6 19.2c.8-2.8 3-4.2 6-4.2s5.2 1.4 6 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                    PROFILO
                </a>
            </div>
            <div class="bottom-element"></div>
        </div>
    </div>
</body>
</html>
