<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 680px;
            background: #111;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 4px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 100, 200, 0.25);
            z-index: 1;
        }
        .top-logo, .menu-container, .bottom-element {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-scatta {
            background: linear-gradient(145deg, #2196F3, #0d47a1);
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            margin-top: 10px;
        }
        .btn-scatta:active {
            transform: scale(0.96);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .menu-container {
            gap: 15px;
            width: 80%;
        }
        .menu-btn {
            background: linear-gradient(145deg, #1976D2, #1565C0);
            color: white;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25), inset 0 2px 2px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            text-align: center;
        }
        .menu-btn:hover {
            background: linear-gradient(145deg, #2196F3, #1976D2);
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .paper-plane {
            width: 120px;
            opacity: 0.9;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="top-logo">
                <a href="scatta.html" class="btn-scatta" style="text-decoration: none; display: inline-block;">SCATTA</a>
            </div>
            <div class="menu-container">
                <a href="album.html" class="menu-btn" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">ALBUM</a>
                <a href="chat.html" class="menu-btn" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">CHAT</a>
                <button class="menu-btn">MAPPA</button>
                <button class="menu-btn">IMPOSTAZIONI</button>
            </div>
            <div class="bottom-element">
                <svg class="paper-plane" viewBox="0 0 500 350" fill="white">
                    <polygon points="0,150 500,0 350,350 250,220 400,80" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2"/>
                    <polygon points="250,220 350,350 300,200" fill="#cfd8dc"/>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
