<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-frame {
            width: 360px;
            height: 680px;
            background: #111;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 4px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: url('cielo-aereo.jpg') no-repeat center center/cover;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }
        .screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            z-index: 1;
        }
        .top-logo, .menu-container, .bottom-element {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn-scatta {
            background: linear-gradient(145deg, #2196F3, #0d47a1);
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: center;
            margin-top: 10px;
        }
        .btn-scatta:active {
            transform: scale(0.96);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .menu-container {
            gap: 15px;
            width: 80%;
        }
        .menu-btn {
            background: #fff;
            color: #1565C0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            transition: background 0.2s, transform 0.12s, color 0.2s;
            text-align: center;
        }
        .menu-btn:hover {
            background: #f3f8ff;
            color: #0d47a1;
        }
        .menu-btn:active {
            transform: scale(0.97);
        }
        .bottom-element {
            min-height: 148px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="top-logo">
                <a href="scatta.html" class="btn-scatta" style="text-decoration: none; display: inline-block;">SCATTA</a>
            </div>
            <div class="menu-container">
                <a href="album.html" class="menu-btn" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">ALBUM</a>
                <a href="chat.html" class="menu-btn" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">CHAT</a>
                <a href="mappa.html" class="menu-btn" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">MAPPA</a>
                <button class="menu-btn">IMPOSTAZIONI</button>
            </div>
            <div class="bottom-element"></div>
        </div>
    </div>
</body>
</html>
